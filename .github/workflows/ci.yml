name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Do not interrupt a production publish halfway through its git push.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  typecheck-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Public website build
        run: npm run build:web

  browser_suites:
    needs: typecheck-test-build
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && !github.event.pull_request.draft)
    name: browser-${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: interactions
            command: npm run test:e2e
          - suite: courses
            command: npm run test:e2e:advanced
          - suite: wires
            command: npm run test:e2e:wires
          - suite: instruments
            command: npm run test:e2e:instruments
    env:
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify system Chrome
        run: google-chrome --version
      - name: Run browser suite
        run: ${{ matrix.command }}
      - name: Save browser evidence
        if: failure() && !cancelled()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence-${{ matrix.suite }}
          path: screenshots/
          retention-days: 1
          if-no-files-found: ignore

  browser-checks:
    needs: [typecheck-test-build, browser_suites]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every browser suite to pass
        env:
          BASIC_RESULT: ${{ needs.typecheck-test-build.result }}
          BROWSER_RESULT: ${{ needs.browser_suites.result }}
          BROWSERS_REQUIRED: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && !github.event.pull_request.draft) }}
        run: |
          test "$BASIC_RESULT" = 'success'
          if [ "$BROWSERS_REQUIRED" = 'true' ]; then
            test "$BROWSER_RESULT" = 'success'
          else
            test "$BROWSER_RESULT" = 'skipped'
          fi

  deploy-web:
    needs: [typecheck-test-build, browser-checks]
    if: >-
      !cancelled() &&
      needs.typecheck-test-build.result == 'success' &&
      needs.browser-checks.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: web-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build public website
        run: npm run build:web
      - name: Publish compiled files
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_DEPLOY_KEY: ${{ secrets.PAGES_DEPLOY_KEY }}
        run: bash scripts/publish-web.sh

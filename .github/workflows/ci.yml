name: CI

on:
  push:
  pull_request:

jobs:
  typecheck-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Production build
        run: npm run build

  browser-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify system Chrome
        run: google-chrome --version
      - name: Physical 3D interaction checks
        run: npm run test:e2e
      - name: Eight course labs, three-phase measurements and viewport checks
        run: npm run test:e2e:advanced
      - name: Wire routing and rendered-mesh collision checks
        run: npm run test:e2e:wires
      - name: Save browser evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: screenshots/
          retention-days: 3
